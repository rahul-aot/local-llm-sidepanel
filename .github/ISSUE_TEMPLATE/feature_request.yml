name: Feature request
description: Suggest a new feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: Who needs this and what do they do today instead?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This works without sending data anywhere except the user's own Ollama server.
          required: true
  - type: dropdown
    id: help
    attributes:
      label: Would you like to build it?
      options:
        - Yes, I'd like to open a pull request
        - Maybe, with some guidance
        - No
